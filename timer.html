<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タイマー</title>
  <link rel="stylesheet" href="timer.css">
</head>
<body>
  <div class="timer">
    <div class="timer-display" id="timer-display">00:00</div>
    <div class="timer-control">
      <button class="start" id="btn-start" onclick="startTimer()" disabled>スタート</button>
      <button class="stop" id="btn-stop" onclick="stopTimer()" disabled>ストップ</button>
    </div>
    <div class="timer-buttons">
      <button onclick="selectTimer(1)">1分</button>
      <button onclick="selectTimer(3)">3分</button>
      <button onclick="selectTimer(5)">5分</button>
      <button onclick="selectTimer(10)">10分</button>
      <button onclick="selectTimer(25)">25分</button>
      <button onclick="selectTimer(60)">1時間</button>
      <button class="reset" onclick="resetTimer()">リセット</button>
    </div>
  </div>

  <script src="timer.js"></script>
</body>
</html>
